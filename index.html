<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Automatic GPS STA Tol</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:100%;
max-width:420px;
padding:30px 20px;
text-align:center;
}

.logo{ margin-bottom:20px; }
.logo img{ width:180px; max-width:90%; }

.title{
font-size:28px;
font-weight:700;
color:#222;
line-height:1.2;
margin-bottom:55px;
}

.sta-label{
font-size:78px;
font-weight:800;
color:#f57c00;
line-height:1;
}

.sta-number{
font-size:72px;
font-weight:800;
color:#f57c00;
line-height:1.05;
margin-top:8px;
margin-bottom:45px;
transition:color .25s;
}

/* Tampilan saat data BASI / tidak akurat */
.sta-number.stale{
color:#bbb;
}

.offset{
font-size:30px;
color:#222;
margin-bottom:40px;
}

.segment{
font-size:32px;
font-weight:700;
color:#111;
line-height:1.2;
margin-bottom:28px;
}

.jalur{
font-size:34px;
font-weight:700;
color:#f57c00;
}

.status{
margin-top:25px;
font-size:18px;
color:#777;
line-height:1.5;
}

.status.warn{ color:#e53935; font-weight:700; }
.status.ok{ color:#2e7d32; }

/* <<< FIX 8: panel debug lapangan */
.debug{
margin-top:18px;
font-size:13px;
color:#999;
font-family:"Courier New", monospace;
line-height:1.6;
border-top:1px dashed #ddd;
padding-top:12px;
display:none;                 /* default tersembunyi */
}
.debug.show{ display:block; }
.debug b{ color:#555; }

.debug-toggle{
margin-top:22px;
font-size:12px;
color:#bbb;
text-decoration:underline;
cursor:pointer;
user-select:none;
}

@media(max-width:480px){
.logo img{ width:160px; }
.title{ font-size:24px; margin-bottom:45px; }
.sta-label{ font-size:68px; }
.sta-number{ font-size:64px; }
.offset{ font-size:24px; }
.segment{ font-size:26px; }
.jalur{ font-size:28px; }
.status{ font-size:16px; }
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<img src="Logo_MMS.png" alt="MMS">
</div>

<div class="title">
STA Tangerang - Merak
</div>

<div class="sta-label">STA</div>

<div class="sta-number" id="sta">--+---</div>

<div class="offset" id="offset">Offset ...</div>

<div class="segment" id="segment">--</div>

<div class="jalur" id="jalur">Detecting Direction...</div>

<div class="status" id="status">Loading data...</div>

<!-- <<< FIX 8: indikator debug untuk uji lapangan -->
<div class="debug-toggle" id="debugToggle">tampilkan info teknis</div>
<div class="debug" id="debug">
  <div><b>Accuracy:</b> <span id="dAcc">-</span> m</div>
  <div><b>Speed:</b> <span id="dSpeed">-</span> km/j</div>
  <div><b>Offset:</b> <span id="dOffset">-</span> m</div>
  <div><b>Lead proj:</b> <span id="dLead">-</span> m</div>
  <div><b>Smoothing:</b> <span id="dSmooth">-</span> titik</div>
  <div><b>Search:</b> <span id="dSearch">-</span></div>
  <div><b>Fix age:</b> <span id="dAge">-</span> ms</div>
</div>

</div>

<script>

/* =====================================
DATABASE
===================================== */
let staData = [];

/* =====================================
SETTING (dilonggarkan untuk kendaraan cepat)
===================================== */

/* Maksimum offset centerline — dinaikkan agar tidak mudah false off-route */
const MAX_OFFSET = 45;

/* Maksimum GPS accuracy — <<< FIX 9: dilonggarkan 30 -> 38.
   Banyak HP Android melaporkan 20-35 m saat bergerak cepat; 30 membuang
   terlalu banyak fix valid sehingga layar sering "Poor GPS". */
const MAX_GPS_ACCURACY = 38;

/* Minimal delta STA untuk deteksi arah */
const MIN_DIRECTION_DELTA = 10;

/* Konfirmasi arah sebelum lock */
const DIRECTION_LOCK_COUNT = 3;
const DIRECTION_CHANGE_COUNT = 5;

/* History STA untuk deteksi arah */
const HISTORY_SIZE = 7;

/* Update interval tampilan (display throttle) */
const UPDATE_INTERVAL = 250;

/* Berapa lama data dianggap masih segar (ms) sebelum di-mark stale */
const STALE_AFTER = 2500;

/* <<< FIX 1 (binary search): jumlah tetangga kiri-kanan yang diperiksa
   di sekitar kandidat hasil binary search untuk memastikan jarak fisik
   (Haversine) benar-benar minimum. Spacing CSV = 5 m, jadi 8 tetangga
   sudah mencakup ±40 m — lebih dari cukup. */
const NEIGHBOR_CHECK = 8;

/* <<< FIX 6: batas lead ekstrapolasi (meter) agar noise kecepatan
   tidak melempar proyeksi terlalu jauh ke depan. */
const MAX_LEAD_METERS = 25;

/* =====================================
VARIABLE
===================================== */
let staHistory = [];
let gpsHistory = [];

/* Smoothing minimal — kunci agar tidak menyeret titik mundur */
let GPS_SMOOTHING = 2;

let lockedJalur = null;
let directionConfirmCount = 0;
let pendingJalur = null;

let lastDisplayUpdate = 0;
let offRouteCounter = 0;

/* Untuk ekstrapolasi maju */
let lastFix = null;        /* {lat, lon, t} fix valid terakhir */
let lastSTAValue = null;   /* nilai STA valid terakhir */
let lastGoodTime = 0;      /* waktu fix valid terakhir */

/* <<< FIX 1: index match terakhir untuk pencarian lokal */
let lastIndex = -1;

/* <<< FIX 8: state debug */
let dbg = { acc: null, speed: null, offset: null, lead: 0, search: "-" };

/* =====================================
DISTANCE (Haversine)
===================================== */
function distance(lat1, lon1, lat2, lon2) {
  let R = 6371000;
  let dLat = (lat2 - lat1) * Math.PI / 180;
  let dLon = (lon2 - lon1) * Math.PI / 180;
  let a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);
  let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

/* =====================================
FORMAT STA  59885 -> 59+885
<<< FIX 3: cegah "+1000" akibat pembulatan meter.
===================================== */
function formatSTA(staValue) {
  let km = Math.floor(staValue / 1000);
  let meter = Math.round(staValue % 1000);
  if (meter >= 1000) {          /* carry-over: 59+1000 -> 60+000 */
    km += 1;
    meter -= 1000;
  }
  return km + "+" + meter.toString().padStart(3, '0');
}

/* =====================================
NEAREST STA — BINARY SEARCH geografis
<<< FIX 1 (binary search): data dijamin urut menaik & rapat (5 m), jadi
titik CSV terdekat secara jarak-tempuh ~ tetangga terdekat secara koordinat.

Strategi 3 langkah, semuanya O(log n):
  (a) Binary search index yang koordinatnya paling dekat ke posisi,
      memakai "posisi relatif sepanjang alignment" sebagai kunci urut.
  (b) Periksa ±NEIGHBOR_CHECK tetangga untuk memastikan jarak Haversine
      benar-benar minimum (mengoreksi lengkungan/ramp).
  (c) Return {index, dist}.

Karena kunci urut geografis tidak selinier nilai STA di semua ramp,
kita cari lewat proyeksi ke titik-titik: bandingkan jarak ke kandidat
tengah vs tetangganya untuk memutuskan arah — pola "descend" pada
fungsi jarak yang uni-modal sepanjang jalur.
===================================== */
function findNearestIndex(posLat, posLon) {
  let n = staData.length;
  if (n === 0) return { index: 0, dist: 999999 };
  if (n === 1) return { index: 0, dist: distance(posLat, posLon, staData[0].lat, staData[0].lon) };

  /* (a) Binary search "menuruni" fungsi jarak.
     Pada jalur yang monoton, jarak ke titik membentuk kurva berbentuk-V
     (turun lalu naik). Kita cari titik minimumnya. */
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) {
    let mid = (lo + hi) >> 1;
    let dMid  = distance(posLat, posLon, staData[mid].lat, staData[mid].lon);
    let dNext = distance(posLat, posLon, staData[mid + 1].lat, staData[mid + 1].lon);
    if (dMid < dNext) {
      hi = mid;      /* minimum ada di kiri (termasuk mid) */
    } else {
      lo = mid + 1;  /* minimum ada di kanan */
    }
  }

  /* (b) Kandidat kasar = lo (atau hi). Periksa tetangga untuk kepastian. */
  let center = lo;
  let from = Math.max(0, center - NEIGHBOR_CHECK);
  let to   = Math.min(n - 1, center + NEIGHBOR_CHECK);

  let min = 999999, idx = center;
  for (let i = from; i <= to; i++) {
    let d = distance(posLat, posLon, staData[i].lat, staData[i].lon);
    if (d < min) { min = d; idx = i; }
  }

  dbg.search = "binary @" + idx;
  return { index: idx, dist: min };
}

/* =====================================
DETECT DIRECTION
<<< FIX 2: pakai tren selisih berurutan (jumlah tanda), bukan hanya
first-vs-last, agar tahan terhadap spike & berhenti-jalan.
===================================== */
function detectDirection() {
  if (staHistory.length < 4) return;

  /* Jumlahkan arah tiap langkah; abaikan langkah yang terlalu kecil (diam). */
  let trend = 0;
  for (let i = 1; i < staHistory.length; i++) {
    let step = staHistory[i] - staHistory[i - 1];
    if (step > 1) trend++;
    else if (step < -1) trend--;
  }

  /* Butuh dominasi arah yang jelas relatif jumlah langkah. */
  let net = staHistory[staHistory.length - 1] - staHistory[0];
  let detectedJalur = null;

  if (trend >= 2 && net >= MIN_DIRECTION_DELTA) {
    detectedJalur = "Jalur A";   /* Menuju Merak (STA naik) */
  } else if (trend <= -2 && net <= -MIN_DIRECTION_DELTA) {
    detectedJalur = "Jalur B";   /* Menuju Tangerang (STA turun) */
  } else {
    return;                      /* ambigu / diam -> jangan ubah lock */
  }

  if (lockedJalur === null) {
    if (detectedJalur === pendingJalur) {
      directionConfirmCount++;
      if (directionConfirmCount >= DIRECTION_LOCK_COUNT) {
        lockedJalur = detectedJalur;
        directionConfirmCount = 0;
        pendingJalur = null;
      }
    } else {
      pendingJalur = detectedJalur;
      directionConfirmCount = 1;
    }
  } else {
    if (detectedJalur !== lockedJalur) {
      if (detectedJalur === pendingJalur) {
        directionConfirmCount++;
        if (directionConfirmCount >= DIRECTION_CHANGE_COUNT) {
          lockedJalur = detectedJalur;
          directionConfirmCount = 0;
          pendingJalur = null;
        }
      } else {
        pendingJalur = detectedJalur;
        directionConfirmCount = 1;
      }
    } else {
      pendingJalur = null;
      directionConfirmCount = 0;
    }
  }
}

/* =====================================
SET STALE (data basi)
===================================== */
function setStale(message, isWarn) {
  let staEl = document.getElementById("sta");
  staEl.classList.add("stale");
  let st = document.getElementById("status");
  st.className = "status" + (isWarn ? " warn" : "");
  st.innerHTML = message;
}

function clearStale() {
  document.getElementById("sta").classList.remove("stale");
}

/* =====================================
FIND STA + tampilkan
===================================== */
function findSTA(posLat, posLon, t) {

  let res = findNearestIndex(posLat, posLon);   /* <<< FIX 1 */
  let index = res.index;
  let min = res.dist;
  let p1 = staData[index];

  dbg.offset = min;

  /* OFF ROUTE VALIDATION */
  if (min > MAX_OFFSET) {
    offRouteCounter++;
  } else {
    offRouteCounter = 0;
  }

  if (offRouteCounter >= 3) {
    setStale("Outside Alignment (data tidak akurat)", true);
    updateDebug(t);
    return;
  }

  /* <<< FIX 4: jangan cemari buffer arah dengan match yang jauh.
     Hanya update history & simpan konteks bila offset masih wajar. */
  if (min <= MAX_OFFSET) {
    lastIndex = index;                 /* konteks terakhir (opsional) */

    staHistory.push(p1.sta);
    if (staHistory.length > HISTORY_SIZE) staHistory.shift();

    detectDirection();

    lastFix = { lat: posLat, lon: posLon, t: t };
    lastSTAValue = p1.sta;
    lastGoodTime = t;
  }

  /* DISPLAY */
  clearStale();
  document.getElementById("sta").innerHTML = formatSTA(p1.sta);
  document.getElementById("offset").innerHTML = "Offset " + min.toFixed(1) + " m";
  document.getElementById("segment").innerHTML = p1.segment;
  document.getElementById("jalur").innerHTML =
    lockedJalur !== null ? lockedJalur : "Detecting Direction...";

  let st = document.getElementById("status");
  st.className = "status ok";
  st.innerHTML = "GPS Active";

  updateDebug(t);
}

/* =====================================
<<< FIX 8: update panel debug
===================================== */
function updateDebug(t) {
  let d = document.getElementById("debug");
  if (!d.classList.contains("show")) return;
  document.getElementById("dAcc").innerHTML    = dbg.acc != null ? dbg.acc.toFixed(0) : "-";
  document.getElementById("dSpeed").innerHTML  = dbg.speed != null ? (dbg.speed * 3.6).toFixed(0) : "-";
  document.getElementById("dOffset").innerHTML = dbg.offset != null ? dbg.offset.toFixed(1) : "-";
  document.getElementById("dLead").innerHTML   = dbg.lead.toFixed(1);
  document.getElementById("dSmooth").innerHTML = GPS_SMOOTHING;
  document.getElementById("dSearch").innerHTML = dbg.search;
  document.getElementById("dAge").innerHTML    = lastGoodTime ? (Date.now() - lastGoodTime) : "-";
}

document.getElementById("debugToggle").addEventListener("click", function () {
  let d = document.getElementById("debug");
  d.classList.toggle("show");
  this.innerHTML = d.classList.contains("show") ? "sembunyikan info teknis" : "tampilkan info teknis";
});

/* =====================================
WATCHDOG
===================================== */
setInterval(function () {
  if (lastGoodTime === 0) return;
  if (Date.now() - lastGoodTime > STALE_AFTER) {
    setStale("Menunggu GPS… (data terakhir mungkin tertinggal)", false);
  }
}, 1000);

/* =====================================
START GPS
===================================== */
function startGPS() {

  if (!navigator.geolocation) {
    document.getElementById("status").innerHTML = "GPS tidak didukung browser";
    return;
  }

  navigator.geolocation.watchPosition(

    function (pos) {

      let now = Date.now();
      let acc = pos.coords.accuracy;
      dbg.acc = acc;                                   /* <<< FIX 8 */

      /* GPS ACCURACY FILTER */
      if (acc > MAX_GPS_ACCURACY) {
        if (now - lastGoodTime > STALE_AFTER) {
          setStale("Poor GPS (" + acc.toFixed(0) + " m)", false);
        }
        return;
      }

      /* SMOOTHING adaptif terhadap kecepatan */
      let speed = pos.coords.speed; /* m/s */
      dbg.speed = speed;                               /* <<< FIX 8 */
      if (speed !== null && speed !== undefined) {
        if (speed > 15) GPS_SMOOTHING = 1;
        else if (speed > 5) GPS_SMOOTHING = 2;
        else GPS_SMOOTHING = 3;
      } else {
        GPS_SMOOTHING = 2;
      }

      gpsHistory.push({ lat: pos.coords.latitude, lon: pos.coords.longitude, t: now });
      while (gpsHistory.length > GPS_SMOOTHING) gpsHistory.shift();

      let lat = 0, lon = 0;
      gpsHistory.forEach(p => { lat += p.lat; lon += p.lon; });
      lat /= gpsHistory.length;
      lon /= gpsHistory.length;

      /* =====================================
      EKSTRAPOLASI MAJU
      <<< FIX 6: lead dikaitkan ke kecepatan aktual & dibatasi
      MAX_LEAD_METERS, bukan konstanta 0.4 dtk.
      ===================================== */
      let projLat = lat, projLon = lon;
      dbg.lead = 0;

      if (gpsHistory.length >= 2) {
        let a = gpsHistory[gpsHistory.length - 2];
        let b = gpsHistory[gpsHistory.length - 1];
        let dt = (b.t - a.t) / 1000; /* detik */

        if (dt > 0 && dt < 3) {
          let vLat = (b.lat - a.lat) / dt;
          let vLon = (b.lon - a.lon) / dt;

          /* lead waktu dasar ~0.4 dtk + kompensasi setengah interval throttle */
          let leadTime = 0.4 + (UPDATE_INTERVAL / 1000) / 2;

          /* jarak proyeksi = kecepatan * waktu; batasi maksimum */
          let projDist = (speed && speed > 0 ? speed : 0) * leadTime;
          if (projDist > MAX_LEAD_METERS) {
            leadTime = leadTime * (MAX_LEAD_METERS / projDist);
            projDist = MAX_LEAD_METERS;
          }
          dbg.lead = projDist;

          projLat = b.lat + vLat * leadTime;
          projLon = b.lon + vLon * leadTime;
        }
      }

      /* DISPLAY THROTTLE */
      if (now - lastDisplayUpdate < UPDATE_INTERVAL) return;
      lastDisplayUpdate = now;

      findSTA(projLat, projLon, now);
    },

    function (err) {
      let msg = "GPS Error";
      if (err.code === 1) msg = "GPS: Izin ditolak";
      else if (err.code === 2) msg = "GPS: Sinyal tidak tersedia";
      else if (err.code === 3) msg = "GPS: Timeout";
      setStale(msg, true);
    },

    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
  );
}

/* =====================================
LOAD CSV
<<< FIX 7: split CRLF-safe, buang baris kosong, validasi lat/lon NaN.
===================================== */
document.getElementById("status").innerHTML = "Loading data...";

fetch("STA_Tamer.csv?nocache=" + Date.now())
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  })
  .then(text => {
    let rows = text.split(/\r?\n/).slice(1);          /* <<< FIX 7: CRLF-safe */
    let loadCount = 0;

    rows.forEach(r => {
      let line = r.trim();
      if (line === "") return;                         /* <<< FIX 7: skip kosong */
      let c = line.split(",");
      if (c.length < 4) return;

      let sta = parseFloat(c[0]);
      let la  = parseFloat(c[1]);
      let lo  = parseFloat(c[2]);
      /* <<< FIX 7: validasi ketiga angka */
      if (isNaN(sta) || isNaN(la) || isNaN(lo)) return;

      staData.push({
        sta: sta,
        lat: la,
        lon: lo,
        segment: c[3].trim()
      });
      loadCount++;
    });

    if (loadCount === 0) {
      document.getElementById("status").innerHTML = "Data kosong / format salah";
      return;
    }

    /* <<< FIX 1 (pendukung): pastikan data urut menaik agar pencarian
       lokal & deteksi arah konsisten. */
    staData.sort((x, y) => x.sta - y.sta);

    document.getElementById("status").innerHTML = "GPS Ready (" + loadCount + " titik)";
    startGPS();
  })
  .catch(err => {
    document.getElementById("status").innerHTML = "Gagal load data: " + err.message;
    console.error("CSV load error:", err);
  });

</script>

</body>

</html>
