<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Automatic GPS STA Tol</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial, Helvetica, sans-serif;
background:white;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

}

.container{

width:100%;
max-width:420px;

padding:30px 20px;

text-align:center;

}

/* =========================
LOGO
========================= */

.logo{

margin-bottom:20px;

}

.logo img{

width:180px;
max-width:90%;

}

/* =========================
TITLE
========================= */

.title{

font-size:28px;
font-weight:700;
color:#222;

line-height:1.2;

margin-bottom:55px;

}

/* =========================
STA LABEL
========================= */

.sta-label{

font-size:78px;
font-weight:800;
color:#f57c00;

line-height:1;

}

/* =========================
STA NUMBER
========================= */

.sta-number{

font-size:72px;
font-weight:800;
color:#f57c00;

line-height:1.05;

margin-top:8px;
margin-bottom:45px;

}

/* =========================
OFFSET
========================= */

.offset{

font-size:30px;
color:#222;

margin-bottom:40px;

}

/* =========================
SEGMENT
========================= */

.segment{

font-size:32px;
font-weight:700;
color:#111;

line-height:1.2;

margin-bottom:28px;

}

/* =========================
JALUR
========================= */

.jalur{

font-size:34px;
font-weight:700;
color:#f57c00;

}

/* =========================
STATUS
========================= */

.status{

margin-top:25px;

font-size:18px;
color:#777;

line-height:1.5;

}

/* =========================
RESPONSIVE MOBILE
========================= */

@media(max-width:480px){

.logo img{
width:160px;
}

.title{
font-size:24px;
margin-bottom:45px;
}

.sta-label{
font-size:68px;
}

.sta-number{
font-size:64px;
}

.offset{
font-size:24px;
}

.segment{
font-size:26px;
}

.jalur{
font-size:28px;
}

.status{
font-size:16px;
}

}

</style>

</head>

<body>

<div class="container">

<!-- =========================
LOGO
========================= -->

<div class="logo">

<img src="Logo_MMS.png">

</div>

<!-- =========================
TITLE
========================= -->

<div class="title">
STA Tangerang - Merak
</div>

<!-- =========================
STA
========================= -->

<div class="sta-label">
STA
</div>

<div class="sta-number" id="sta">
--+---
</div>

<!-- =========================
OFFSET
========================= -->

<div class="offset" id="offset">
Offset ...
</div>

<!-- =========================
SEGMENT
========================= -->

<div class="segment" id="segment">
--
</div>

<!-- =========================
JALUR
========================= -->

<div class="jalur" id="jalur">
Detecting Direction...
</div>

<!-- =========================
STATUS
========================= -->

<div class="status" id="status">
Loading data...
</div>

</div>

<script>

/* =====================================
DATABASE
===================================== */

let staData = [];

/* =====================================
SETTING
===================================== */

/* Maksimum offset centerline */
const MAX_OFFSET = 30;

/* Maksimum GPS accuracy */
const MAX_GPS_ACCURACY = 15;

/* Minimal delta STA untuk deteksi arah */
const MIN_DIRECTION_DELTA = 10;

/* Jumlah konfirmasi arah sebelum lock */
const DIRECTION_LOCK_COUNT = 3;

/* Jumlah konfirmasi arah berlawanan sebelum ganti lock */
const DIRECTION_CHANGE_COUNT = 5;

/* History STA untuk deteksi arah */
const HISTORY_SIZE = 7;

/* Update interval */
const UPDATE_INTERVAL = 250;

/* =====================================
VARIABLE
===================================== */

let staHistory = [];
let gpsHistory = [];
let GPS_SMOOTHING = 5;

/*
  lockedJalur: null = belum terkunci
  "Jalur A" atau "Jalur B" = terkunci
*/
let lockedJalur = null;

/*
  Penghitung konfirmasi arah sementara
  (sebelum lock resmi berubah)
*/
let directionConfirmCount = 0;
let pendingJalur = null;

let lastUpdate = 0;
let offRouteCounter = 0;

/* =====================================
DISTANCE FUNCTION
===================================== */

function distance(lat1, lon1, lat2, lon2) {

  let R = 6371000;

  let dLat = (lat2 - lat1) * Math.PI / 180;
  let dLon = (lon2 - lon1) * Math.PI / 180;

  let a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);

  let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;

}

/* =====================================
FORMAT STA
59885 -> 59+885
===================================== */

function formatSTA(staValue) {

  let km = Math.floor(staValue / 1000);
  let meter = Math.round(staValue % 1000);

  return km + "+" + meter.toString().padStart(3, '0');

}

/* =====================================
DETECT DIRECTION (dengan lock kuat)
===================================== */

function detectDirection() {

  if (staHistory.length < 4) return;

  let firstSTA = staHistory[0];
  let lastSTA = staHistory[staHistory.length - 1];
  let delta = lastSTA - firstSTA;

  let detectedJalur = null;

  if (delta >= MIN_DIRECTION_DELTA) {
    detectedJalur = "Jalur A";  /* Menuju Merak */
  } else if (delta <= -MIN_DIRECTION_DELTA) {
    detectedJalur = "Jalur B";  /* Menuju Tangerang */
  } else {
    /* Delta terlalu kecil, belum bisa tentukan arah */
    return;
  }

  /* Kalau belum ada lock, langsung set pending */
  if (lockedJalur === null) {

    if (detectedJalur === pendingJalur) {

      directionConfirmCount++;

      /* Butuh DIRECTION_LOCK_COUNT konfirmasi untuk lock pertama */
      if (directionConfirmCount >= DIRECTION_LOCK_COUNT) {
        lockedJalur = detectedJalur;
        directionConfirmCount = 0;
        pendingJalur = null;
      }

    } else {

      /* Arah baru, reset counter */
      pendingJalur = detectedJalur;
      directionConfirmCount = 1;

    }

  } else {

    /* Sudah ada lock — hanya ganti jika arah berlawanan
       dan konfirmasi sudah cukup banyak */

    if (detectedJalur !== lockedJalur) {

      if (detectedJalur === pendingJalur) {

        directionConfirmCount++;

        /* Butuh DIRECTION_CHANGE_COUNT konfirmasi untuk ganti lock */
        if (directionConfirmCount >= DIRECTION_CHANGE_COUNT) {
          lockedJalur = detectedJalur;
          directionConfirmCount = 0;
          pendingJalur = null;
        }

      } else {

        pendingJalur = detectedJalur;
        directionConfirmCount = 1;

      }

    } else {

      /* Sesuai lock saat ini, reset pending */
      pendingJalur = null;
      directionConfirmCount = 0;

    }

  }

}

/* =====================================
FIND STA
===================================== */

function findSTA(lat, lon) {

  let min = 999999;
  let index = 0;

  /* Cari titik STA terdekat */
  staData.forEach((p, i) => {

    let d = distance(lat, lon, p.lat, p.lon);

    if (d < min) {
      min = d;
      index = i;
    }

  });

  let p1 = staData[index];

  /* =====================================
  OFF ROUTE VALIDATION
  ===================================== */

  if (min > MAX_OFFSET) {

    offRouteCounter++;

  } else {

    offRouteCounter = 0;

  }

  /* Jika benar-benar off route */
  if (offRouteCounter >= 3) {

    document.getElementById("status").innerHTML =
      "Outside Alignment";

    return;

  }

  /* =====================================
  UPDATE HISTORY STA
  ===================================== */

  staHistory.push(p1.sta);

  if (staHistory.length > HISTORY_SIZE) {
    staHistory.shift();
  }

  /* =====================================
  DETEKSI ARAH
  ===================================== */

  detectDirection();

  /* =====================================
  DISPLAY STA
  ===================================== */

  document.getElementById("sta").innerHTML =
    formatSTA(p1.sta);

  /* =====================================
  DISPLAY OFFSET
  ===================================== */

  document.getElementById("offset").innerHTML =
    "Offset " + min.toFixed(1) + " m";

  /* =====================================
  DISPLAY SEGMENT
  ===================================== */

  document.getElementById("segment").innerHTML =
    p1.segment;

  /* =====================================
  DISPLAY JALUR
  ===================================== */

  document.getElementById("jalur").innerHTML =
    lockedJalur !== null ? lockedJalur : "Detecting Direction...";

  /* =====================================
  DISPLAY STATUS
  ===================================== */

  document.getElementById("status").innerHTML =
    "GPS Active";

}

/* =====================================
START GPS
===================================== */

function startGPS() {

  if (!navigator.geolocation) {

    document.getElementById("status").innerHTML =
      "GPS tidak didukung browser";

    return;

  }

  navigator.geolocation.watchPosition(

    function (pos) {

      /* =====================================
      UPDATE THROTTLING
      ===================================== */

      let now = Date.now();

      if (now - lastUpdate < UPDATE_INTERVAL) {
        return;
      }

      lastUpdate = now;

      /* =====================================
      GPS ACCURACY FILTER
      ===================================== */

      let acc = pos.coords.accuracy;

      if (acc > MAX_GPS_ACCURACY) {

        document.getElementById("status").innerHTML =
          "Poor GPS (" + acc.toFixed(0) + " m)";

        return;

      }

      /* =====================================
      SPEED ADAPTIVE SMOOTHING
      Fallback ke riwayat STA jika speed null
      ===================================== */

      let speed = pos.coords.speed;

      if (speed !== null && speed !== undefined) {

        /* m/s */
        if (speed > 20) {
          GPS_SMOOTHING = 2;
        } else if (speed > 10) {
          GPS_SMOOTHING = 3;
        } else {
          GPS_SMOOTHING = 5;
        }

      } else {

        /* Speed tidak tersedia — estimasi dari delta STA history */
        if (staHistory.length >= 2) {

          let staDelta = Math.abs(
            staHistory[staHistory.length - 1] -
            staHistory[staHistory.length - 2]
          );

          /* Anggap update ~250ms, delta STA ~ jarak tempuh */
          /* staDelta besar = kecepatan tinggi */

          if (staDelta > 5) {
            GPS_SMOOTHING = 2;
          } else if (staDelta > 2) {
            GPS_SMOOTHING = 3;
          } else {
            GPS_SMOOTHING = 5;
          }

        } else {

          GPS_SMOOTHING = 5;

        }

      }

      /* =====================================
      GPS SMOOTHING
      ===================================== */

      gpsHistory.push({
        lat: pos.coords.latitude,
        lon: pos.coords.longitude
      });

      if (gpsHistory.length > GPS_SMOOTHING) {
        gpsHistory.shift();
      }

      let lat = 0;
      let lon = 0;

      gpsHistory.forEach(p => {
        lat += p.lat;
        lon += p.lon;
      });

      lat = lat / gpsHistory.length;
      lon = lon / gpsHistory.length;

      /* =====================================
      FIND STA
      ===================================== */

      findSTA(lat, lon);

    },

    function (err) {

      let msg = "GPS Error";

      /* Pesan lebih informatif per error code */
      if (err.code === 1) {
        msg = "GPS: Izin ditolak";
      } else if (err.code === 2) {
        msg = "GPS: Sinyal tidak tersedia";
      } else if (err.code === 3) {
        msg = "GPS: Timeout";
      }

      document.getElementById("status").innerHTML = msg;

    },

    {
      enableHighAccuracy: true,
      timeout: 5000,
      maximumAge: 0
    }

  );

}

/* =====================================
LOAD CSV
===================================== */

document.getElementById("status").innerHTML = "Loading data...";

fetch("STA_Tamer.csv?nocache=" + Date.now())

  .then(r => {

    if (!r.ok) {
      throw new Error("HTTP " + r.status);
    }

    return r.text();

  })

  .then(text => {

    let rows = text.split("\n").slice(1);

    let loadCount = 0;

    rows.forEach(r => {

      /* Trim untuk handle \r\n (Windows line endings) */
      let c = r.trim().split(",");

      /* FORMAT: STA,Lat,Long,Segment */
      if (c.length >= 4 && !isNaN(parseFloat(c[0]))) {

        staData.push({
          sta: parseFloat(c[0]),
          lat: parseFloat(c[1]),
          lon: parseFloat(c[2]),
          segment: c[3].trim()
        });

        loadCount++;

      }

    });

    if (loadCount === 0) {

      document.getElementById("status").innerHTML =
        "Data kosong / format salah";

      return;

    }

    document.getElementById("status").innerHTML =
      "GPS Ready (" + loadCount + " titik)";

    startGPS();

  })

  .catch(err => {

    document.getElementById("status").innerHTML =
      "Gagal load data: " + err.message;

    console.error("CSV load error:", err);

  });

</script>

</body>

</html>
